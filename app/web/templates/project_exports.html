{% extends "base.html" %}
{% block title %}Экспорт проекта - MarketMind AI{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Экспорт результата</h1>
<p class="text-gray-600 mb-4">{{ project.name }}</p>
<div class="bg-white border rounded p-5 mb-5">
  <p class="mb-3">Экспорт использует только актуальную применённую карточку товара.</p>
  <div class="flex gap-2">
    <button class="bg-blue-600 text-white px-4 py-2 rounded" hx-post="/api/projects/{{ project.project_id }}/exports" hx-vals='{"file_format":"csv","marketplace_profile":"universal"}' hx-target="#export-list">Создать CSV</button>
    <button class="bg-blue-600 text-white px-4 py-2 rounded" hx-post="/api/projects/{{ project.project_id }}/exports" hx-vals='{"file_format":"json","marketplace_profile":"universal"}' hx-target="#export-list">Создать JSON</button>
    <button class="bg-blue-600 text-white px-4 py-2 rounded" hx-post="/api/projects/{{ project.project_id }}/exports" hx-vals='{"file_format":"xlsx","marketplace_profile":"universal"}' hx-target="#export-list">Создать XLSX</button>
  </div>
</div>
<div id="export-list" class="bg-white border rounded p-5">
  {% include "project_exports_list.html" %}
</div>
{% endblock %}

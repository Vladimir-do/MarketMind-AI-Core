<div class="bg-green-50 border border-green-200 rounded p-4 text-sm">
  <div class="font-semibold text-green-800 mb-1">Проект создан</div>
  <div class="text-green-900 mb-3">{{ project.name }}</div>
  <div class="text-green-900 mb-3">Создан: {{ project.created_at.strftime("%d.%m.%Y %H:%M") if project.created_at else "не указано" }}</div>
  <div class="flex flex-wrap gap-2">
    <a href="/projects/{{ project.project_id }}/market-analysis" class="bg-blue-600 text-white px-3 py-2 rounded">Перейти к анализу рынка</a>
    <a href="/projects/{{ project.project_id }}" class="bg-white border border-blue-300 text-blue-700 px-3 py-2 rounded">Открыть проект</a>
    <a href="/projects/{{ project.project_id }}/import" class="bg-white border border-gray-300 px-3 py-2 rounded">Ручной импорт</a>
  </div>
</div>

id: title_generator
version: "1"
status: active
purpose: "Генерация SEO-заголовка карточки товара с альтернативами"
model: claude-sonnet-5-5
marketplace: universal
category: null
input_schema: app.content_pipeline.schemas.ProductPassport
output_schema: app.content_pipeline.schemas.TitleGenerationResult
system_prompt: |
  Ты копирайтер по SEO-заголовкам карточек товаров на маркетплейсах.
  Запрещено: придумывать характеристики, которых нет в паспорте товара;
  использовать запрещённые слова; дублировать название конкурентов.
  Используй только ключи из семантического плана ниже — не добавляй
  посторонние ключевые слова.
  Отвечай ТОЛЬКО JSON-объектом без markdown и пояснений.
user_prompt_template: |
  Паспорт товара:
  Название (текущее): {title}
  Бренд: {brand}
  Категория: {category}
  Характеристики: {attributes}
  Маркетплейс: {marketplace}
  Лимит длины названия: {title_max} символов

  Стратегия:
  Целевая аудитория: {strategy_target_audience}
  УТП: {strategy_key_selling_proposition}
  Тон: {strategy_tone_of_voice}

  Ключи для названия (используй только их): {semantic_title_terms}

  Верни JSON:
  {{
    "title": "строка (не длиннее лимита)",
    "alternatives": ["строка", "строка", "строка", "строка"],
    "used_keywords": ["строка", "..."],
    "reasoning": "краткое объяснение выбора",
    "confidence": 0.0
  }}
  Итого минимум 5 вариантов названия (title + 4 alternatives).

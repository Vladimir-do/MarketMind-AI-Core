id: description_generator
version: "1"
status: active
purpose: "Генерация описания карточки товара из стратегии, семантики и преимуществ"
model: claude-sonnet-5-5
marketplace: universal
category: null
input_schema: app.content_pipeline.schemas.ProductPassport
output_schema: app.content_pipeline.schemas.DescriptionGenerationResult
system_prompt: |
  Ты копирайтер описаний товаров для карточек маркетплейсов.
  Описание не пишется "с нуля" — оно собирается из уже готовых
  стратегии, семантического плана и преимуществ, переданных тебе.
  Запрещено: выдумывать факты, которых нет в паспорте товара;
  чрезмерные рекламные клише; повтор ключевых слов; длинные
  бессодержательные абзацы; заявления из списка forbidden_claims.
  Структура описания: назначение, ключевая выгода, особенности,
  сценарии использования, материалы/размеры/комплектация (если есть
  в паспорте), рекомендации по использованию, закрытие возражений.
  Отвечай ТОЛЬКО JSON-объектом без markdown и пояснений.
user_prompt_template: |
  Паспорт товара:
  Название: {title}
  Характеристики: {attributes}
  Бренд: {brand}
  Категория: {category}

  Стратегия:
  Тон: {strategy_tone_of_voice}
  Структура описания: {strategy_description_structure}
  Запрещённые заявления: {strategy_forbidden_claims}

  Преимущества (используй как есть, не придумывай новые):
  {benefits_bullets}

  Ключи для описания: {semantic_description_terms}

  Верни JSON:
  {{
    "short_description": "1-2 предложения",
    "full_description": "полный текст описания",
    "blocks": {{"назначение": "...", "особенности": "...", "сценарии_использования": "..."}},
    "used_keywords": ["строка", "..."],
    "reasoning": "краткое объяснение",
    "confidence": 0.0
  }}

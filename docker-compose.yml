services:
  bot:
    build: .
    container_name: marketmind-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - bot-data:/app/app/data
      - ./app/data/ozon_profile:/app/app/data/ozon_profile
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  postgres:
    image: postgres:16-alpine
    container_name: marketmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: parser_db
      POSTGRES_USER: marketmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file — no insecure default is provided}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketmind -d parser_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  bot-data:
  pg-data:

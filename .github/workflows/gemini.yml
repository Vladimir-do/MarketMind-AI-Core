name: Gemini CLI

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt for Gemini CLI'
        required: true
        default: 'Run tests and report results'

jobs:
  gemini:
    if: |-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        startsWith(github.event.comment.body, '@gemini-cli')
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        startsWith(github.event.comment.body, '@gemini-cli')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine prompt
        id: prompt
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "prompt=${{ inputs.prompt }}" >> "$GITHUB_OUTPUT"
          else
            COMMENT="${{ github.event.comment.body }}"
            PROMPT="${COMMENT#@gemini-cli}"
            PROMPT="${PROMPT#/}"
            if [[ -z "$PROMPT" ]]; then
              PROMPT="Analyze the current context and suggest improvements"
            fi
            echo "prompt=$PROMPT" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Gemini CLI
        uses: google-github-actions/run-gemini-cli@v0.1.22
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          gemini_model: gemini-2.5-flash
          upload_artifacts: true
